name: Save client uploads
on:
  push:
    paths: ['incoming/*.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency: fetch-uploads
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fetch_uploads.py
        env:
          TALLY_API_KEY: ${{ secrets.TALLY_API_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Save client uploads" && git pull --rebase && git push)
